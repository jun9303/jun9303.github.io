# Site-wide notice shown below the masthead.
# The banner appears when the current time is at or after `start` and before `end`.
# Use ISO 8601 with an explicit offset. Singapore is +08:00.
start: "2026-11-13T00:00:00+08:00"
end: "2026-11-15T00:00:00+08:00"

# Banner text. `label` is shown in bold before the message.
label: "<Notice>"
message: "Due to a global Microsoft 365 outage, my emails and communications may be delayed. Sorry for any inconvenience."
